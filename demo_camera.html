<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live camera detection</title>
<style>
  :root { --ink: #1f1f1e; --muted: #6b6a63; --line: #e4e3dd; --accent: #2a78d6; --surface: #fcfcfb;
    --field: #ffffff; --idle: #b9b8b1; color-scheme: light; }
  :root[data-theme=dark] { --ink: #f3f4f6; --muted: #9ca3af; --line: #374151; --accent: #3b8ae6;
    --surface: #0b0f19; --field: #1f2937; --idle: #4b5563; color-scheme: dark; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--surface); }
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  [hidden] { display: none !important; }
  label.inline { flex-direction: row; align-items: center; color: var(--ink); font-size: 14px; }
  input[type=text], select { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; min-width: 220px;
    color: var(--ink); background: var(--field); }
  button { font: inherit; padding: 7px 18px; border: 0; border-radius: 6px; background: var(--accent); color: white; cursor: pointer; }
  button.stop { background: #e34948; }
  button:disabled { background: var(--idle); cursor: default; }
  progress { width: 240px; height: 14px; accent-color: var(--accent); }
  #downloadText { color: var(--muted); align-self: center; }
  .stage { position: relative; display: inline-block; background: #000; border-radius: 6px; overflow: hidden; line-height: 0; }
  video { display: block; max-width: 100%; max-height: 72vh; width: auto; height: auto; min-width: 320px; min-height: 240px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #status { margin-top: 8px; color: var(--muted); min-height: 1.4em; }
</style>
</head>
<body>
<div class="controls">
  <label>Categories (comma-separated COCO names; empty means all 80)
    <input id="categories" type="text" value="">
  </label>
  <label>Camera <select id="camera"><option value="">Default camera</option></select></label>
  <label id="modelField">Model <select id="model"></select></label>
  <label class="inline" id="trackField"><input id="track" type="checkbox" checked>&nbsp;Track across frames</label>
  <label class="inline" id="deviceSwitch" hidden><input id="device" type="checkbox">&nbsp;<span id="deviceText">Run on this device (WebGPU)</span></label>
  <button id="toggle">Start camera</button>
</div>
<div class="controls" id="deviceStep" hidden>
  <button id="download">Download the detector (1.2 GB)</button>
  <progress id="progress" value="0" max="1" hidden></progress>
  <span id="downloadText"></span>
</div>
<div class="stage"><video id="video" muted playsinline autoplay></video><canvas id="overlay"></canvas></div>
<div id="status">The camera plays live; boxes from the last detected frame are drawn over it.</div>
<script>
const $ = (id) => document.getElementById(id);

// The page follows the demo's light or dark theme: Gradio marks its body with the class
// `dark`; opened on its own, the page follows the system setting.
(() => {
  const system = matchMedia("(prefers-color-scheme: dark)");
  let host = null;
  try { if (parent !== window) host = parent.document.body; } catch { /* another origin */ }
  const apply = () => {
    const dark = host ? host.classList.contains("dark") : system.matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    // Inside the demo the page takes the tab's own background.
    document.body.style.background = host ? "transparent" : "";
  };
  apply();
  system.addEventListener("change", apply);
  if (host) new MutationObserver(apply).observe(host, { attributes: true, attributeFilter: ["class"] });
})();
const video = $("video"), overlay = $("overlay"), status = $("status"), toggle = $("toggle");
const grab = document.createElement("canvas");
const grabCrop = document.createElement("canvas");
let config = null, running = false, stream = null, boxes = [], scale = 1, session = null;
// The detector in this browser, once loaded: { model, patches, side, candidates, select }.
let local = null, loadingLocal = null;
// `camera?device=1` is the page of the demo's "On device" tab: only the browser's detector.
const onDevice = new URLSearchParams(location.search).get("device") === "1";
const PALETTE = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"];

fetch("camera/config").then((r) => r.json()).then((c) => {
  config = c;
  for (const name of c.models) $("model").add(new Option(name, name, false, name === c.default));
  // Offered when the server has an export for the browser; needs WebGPU in the browser.
  if (!c.device) {
    if (onDevice) status.textContent = "This deployment has no export for the browser.";
    return;
  }
  $("deviceSwitch").hidden = onDevice;
  if (!navigator.gpu) {
    $("device").disabled = true;
    $("deviceText").textContent = "Run on this device: this browser has no WebGPU";
    if (onDevice) {
      toggle.disabled = true;
      status.textContent = "This browser has no WebGPU, which the on-device detector needs "
        + "(Safari 26, Chrome or Edge 113 and later; in Firefox it depends on the platform).";
    }
    return;
  }
  if (onDevice) {
    $("device").checked = true;
    $("modelField").hidden = true; $("trackField").hidden = true;
    status.textContent = `Runs the 4-bit detector (${c.device.export}) in this browser on WebGPU: `
      + "first download the detector, then start the camera.";
    showDeviceStep();
  }
});

// The download is its own step: the button fetches the weights (the browser keeps them),
// and the camera starts on this device only once the detector is loaded.
async function showDeviceStep() {
  const on = $("device").checked;
  $("deviceStep").hidden = !on;
  toggle.disabled = on && !local;
  if (!on || local || loadingLocal) return;
  const kept = "caches" in window && (await (await caches.open("crescent-moon-weights")).keys()).length > 0;
  $("download").textContent = kept ? "Load the detector (already downloaded)" : "Download the detector (1.2 GB)";
  $("downloadText").textContent = kept ? "" : "One download; the browser keeps it for next time.";
}
$("download").addEventListener("click", loadLocal);

$("device").addEventListener("change", () => {
  const on = $("device").checked;
  $("model").disabled = on; $("track").disabled = on;
  boxes = [];
  if (on && running && !local) stop("Stopped; download the detector, then start the camera.");
  showDeviceStep();
});

// Downloads the weights once (the browser keeps them) and builds the WebGPU pipelines.
function loadLocal() {
  loadingLocal ??= (async () => {
    const megabytes = (bytes) => (bytes / 2 ** 20).toFixed(0);
    $("download").disabled = true; $("progress").hidden = false;
    $("progress").value = 0; $("downloadText").textContent = "Starting the download";
    const [runtime, selection] = await Promise.all([import("./web/model.js"), import("./web/select.js")]);
    const model = await runtime.loadModel(new URL(config.device.weights, location.href), (done, total) => {
      $("progress").value = done / total;
      $("downloadText").textContent = `${megabytes(done)} of ${megabytes(total)} MB`;
    });
    $("downloadText").textContent = "Preparing the detector on the GPU";
    model.device.lost.then((info) => {
      local = null; loadingLocal = null; $("download").disabled = false; $("progress").hidden = true; $("downloadText").textContent = "";
      if (onDevice) { stop(`The browser's GPU device was lost (${info.message || info.reason}).`); showDeviceStep(); return; }
      $("device").checked = false; $("model").disabled = false; $("track").disabled = false;
      showDeviceStep();
      status.textContent = `The browser's GPU device was lost (${info.message || info.reason}); back on the server.`;
    });
    local = { model, patches: runtime.patches, side: runtime.CROP, ...selection };
    $("progress").hidden = true; $("download").textContent = "Detector ready";
    $("downloadText").textContent = ""; toggle.disabled = false;
    status.textContent = "The detector is loaded on this device; start the camera.";
  })().catch((error) => {
    loadingLocal = null; $("download").disabled = false; $("progress").hidden = true; $("downloadText").textContent = "";
    if (onDevice) { stop(`Could not run on this device: ${error.message}`); showDeviceStep(); return; }
    $("device").checked = false; $("model").disabled = false; $("track").disabled = false;
    showDeviceStep();
    status.textContent = `Could not run on this device: ${error.message}`;
  });
  return loadingLocal;
}

function colourOf(label) {
  let hash = 0;
  for (const letter of label) hash = (hash * 31 + letter.codePointAt(0)) >>> 0;
  return PALETTE[hash % PALETTE.length];
}

// One frame through the detector in this browser: the whole frame resized to the
// model's square crop, one forward pass, selection; boxes in video pixels.
async function detectLocal(w, h) {
  const side = local.side, settings = local.model.manifest.selection;
  grabCrop.width = grabCrop.height = side;
  const pen = grabCrop.getContext("2d", { willReadFrequently: true });
  pen.drawImage(video, 0, 0, side, side);
  const started = performance.now();
  const rows = local.patches(pen.getImageData(0, 0, side, side).data, 4);
  const { slots, seconds } = await local.model.run(rows, { timed: true });
  const asked = $("categories").value.split(",").map((p) => p.trim().toLowerCase()).filter(Boolean);
  const found = local.select(local.candidates(slots, local.model.manifest.vocabulary, settings.box_power), w, h,
    { threshold: settings.threshold, duplicateIou: settings.duplicate_iou, labels: asked.length ? asked : null });
  const total = (performance.now() - started) / 1000;
  boxes = found.map((b) => ({ ...b, colour: colourOf(b.label) })); scale = 1;
  const stage = (name) => `${name} ${seconds[name].toFixed(3)} s`;
  status.textContent = `On this device: ${boxes.length} boxes; ${total.toFixed(3)} s per frame (`
    + `${stage("vision")}, ${stage("projection")}, ${stage("decoder")}, ${stage("readout")})`;
}

// Camera names are only shown once the page may use a camera, so the list is filled
// again after each start and whenever a camera is plugged in or out.
async function listCameras() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  const picker = $("camera"), chosen = picker.value || currentCamera();
  picker.replaceChildren(...devices.map((d, i) =>
    new Option(d.label || `Camera ${i + 1}`, d.deviceId, false, d.deviceId === chosen)));
  if (!devices.length) picker.add(new Option("No camera found", ""));
}

function currentCamera() {
  const track = stream && stream.getVideoTracks()[0];
  return track ? track.getSettings().deviceId || "" : "";
}

async function openCamera() {
  const id = $("camera").value;
  const video_ = { width: { ideal: 1280 } };
  if (id) video_.deviceId = { exact: id };
  const next = await navigator.mediaDevices.getUserMedia({ video: video_, audio: false });
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = next;
  video.srcObject = stream;
  await video.play();
}

navigator.mediaDevices.addEventListener("devicechange", listCameras);
listCameras();
$("camera").addEventListener("change", async () => {
  if (!running) return;
  try {
    await openCamera();
    // The old camera's boxes and tracks do not belong to the new picture.
    boxes = []; session = crypto.randomUUID();
  } catch (error) {
    status.textContent = `Could not open that camera: ${error.message}`;
  }
});

function draw() {
  const w = video.videoWidth, h = video.videoHeight;
  if (w && (overlay.width !== w || overlay.height !== h)) { overlay.width = w; overlay.height = h; }
  const pen = overlay.getContext("2d");
  pen.clearRect(0, 0, overlay.width, overlay.height);
  // Sizes in video pixels, chosen so they read the same at any displayed size.
  const shown = overlay.getBoundingClientRect().width || w;
  const unit = w / shown;
  const line = Math.max(1, Math.round(2 * unit));
  pen.font = `${Math.round(12 * unit)}px system-ui, sans-serif`;
  pen.textBaseline = "top";
  for (const b of boxes) {
    const [x0, y0, x1, y1] = b.box.map((v) => v * scale);
    pen.strokeStyle = b.colour; pen.lineWidth = line;
    pen.strokeRect(x0, y0, x1 - x0, y1 - y0);
    const text = b.score === null ? b.label : `${b.label} ${b.score.toFixed(2)}`;
    const width = pen.measureText(text).width, height = Math.round(15 * unit);
    pen.fillStyle = b.colour; pen.fillRect(x0, y0, width + 6 * unit, height);
    pen.fillStyle = "white"; pen.fillText(text, x0 + 3 * unit, y0 + 1.5 * unit);
  }
  if (running) requestAnimationFrame(draw);
}

async function detectLoop() {
  const started = performance.now();
  let first = true;
  while (running) {
    if (performance.now() - started > config.seconds * 1000) {
      stop(`Stopped after ${config.seconds / 60} minutes; press Start camera to go on.`);
      return;
    }
    const w = video.videoWidth, h = video.videoHeight;
    if (!w) { await new Promise((r) => setTimeout(r, 100)); continue; }
    if ($("device").checked) {
      if (!local) { stop("Download the detector, then start the camera."); return; }
      await detectLocal(w, h);
      // Let the page paint and take input between frames.
      await new Promise((r) => setTimeout(r, 0));
      continue;
    }
    const s = Math.min(1, config.side / Math.max(w, h));
    grab.width = Math.round(w * s); grab.height = Math.round(h * s);
    grab.getContext("2d").drawImage(video, 0, 0, grab.width, grab.height);
    const blob = await new Promise((r) => grab.toBlob(r, "image/jpeg", 0.85));
    const query = new URLSearchParams({
      session, model: $("model").value, categories: $("categories").value,
      track: $("track").checked ? "1" : "0",
    });
    const t0 = performance.now();
    let response;
    try {
      response = await fetch(`camera/frame?${query}`, { method: "POST", body: blob });
    } catch (error) {
      status.textContent = `Request failed (${error}); retrying.`;
      await new Promise((r) => setTimeout(r, 1000));
      continue;
    }
    if (!response.ok) {
      const detail = await response.text();
      if (response.status === 410) { stop(detail); return; }
      status.textContent = `Error ${response.status}: ${detail}; retrying.`;
      await new Promise((r) => setTimeout(r, 1000));
      continue;
    }
    const result = await response.json();
    if (!running) return;
    boxes = result.boxes; scale = w / grab.width;
    const trip = (performance.now() - t0) / 1000;
    status.textContent = `${$("model").value}: ${boxes.length} boxes; detector ${result.seconds.toFixed(3)} s, `
      + `server ${result.server_seconds.toFixed(3)} s, with the network ${trip.toFixed(3)} s`
      + (first ? " (first frame includes the GPU start)" : "");
    first = false;
  }
}

async function start() {
  try {
    await openCamera();
  } catch (error) {
    status.textContent = `No camera: ${error.message}`;
    return;
  }
  await listCameras();
  running = true; boxes = []; session = crypto.randomUUID();
  toggle.textContent = "Stop"; toggle.classList.add("stop");
  if (!$("device").checked) {
    status.textContent = "Starting the GPU: the first boxes can take about a minute; the camera keeps playing.";
  }
  requestAnimationFrame(draw);
  detectLoop();
}

function stop(message) {
  running = false; boxes = [];
  overlay.getContext("2d").clearRect(0, 0, overlay.width, overlay.height);
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; video.srcObject = null;
  toggle.textContent = "Start camera"; toggle.classList.remove("stop");
  if (message) status.textContent = message;
}

toggle.addEventListener("click", () => (running ? stop("Stopped.") : start()));
</script>
</body>
</html>
